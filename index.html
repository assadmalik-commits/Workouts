<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e14" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Training Log</title>
    <!-- Runs before anything paints, and before React exists.

         The palette in index.css is dark by default; light is the override
         that data-app-theme switches on. So a document with no attribute yet
         is a dark document. React sets that attribute from an effect, which
         runs after the first paint — which meant a lifter who had chosen day
         got a frame of night on every single open.

         sync.js and the artifact build both copy this element through by its
         id, so there is one copy of it and it cannot drift. -->
    <script id="theme-boot">
      // A record of what actually happened, for the diagnostics panel. Tapping
      // the version number in the header shows it. Reading a flash off a
      // recording is guesswork; this is the app saying what it did.
      window.__trace = [];
      window.__note = function (step, detail) {
        try {
          window.__trace.push({ at: Math.round(performance.now()), step: step, detail: detail });
        } catch (e) {}
      };
      // Two places, because one of them is demonstrably not holding. A boot
      // report from the lifter's phone showed localStorage keeping three days
      // of training and losing the theme, so the cookie is a second chance at
      // an answer that has to be readable before the first paint.
      window.__cookieTheme = function () {
        try {
          var m = document.cookie.match(/(?:^|;\s*)apptheme=([^;]*)/);
          return m ? decodeURIComponent(m[1]) : null;
        } catch (e) {
          return null;
        }
      };
      try {
        var d = document.documentElement;
        var stored = null;
        try {
          stored = JSON.parse(localStorage.getItem('theme'));
        } catch (e) {
          stored = null;
        }
        var cookie = window.__cookieTheme();
        var t = stored;
        if (t !== 'dark' && t !== 'light' && t !== 'system') t = cookie;
        // 'system' is the default and means "follow the phone", which is the
        // one answer readable before the first paint. It is also what is left
        // when iOS discards this frame's localStorage with the tab — which is
        // every reopen, and why an app-held preference could never be trusted
        // to be there.
        if (t !== 'dark' && t !== 'light') {
          t =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light';
        }
        d.dataset.appTheme = t;
        d.style.colorScheme = t;
        // Paint the ground here, not only the attribute. The attribute decides
        // nothing until our own stylesheet parses, and until then the host's
        // reset is in force — body{background:#faf9f5}, which is light. That
        // gap is 26KB of CSS wide and it is the light frame being reported.
        // An inline style beats the host's rule and needs no stylesheet at all.
        var ground = t === 'dark' ? '#0b0e14' : '#f2f4f8';
        d.style.backgroundColor = ground;
        if (document.body) document.body.style.backgroundColor = ground;
        window.__note('boot', {
          stored: stored,
          cookie: cookie,
          phone: window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light',
          painted: t,
        });
      } catch (e) {
        window.__note('boot failed', { error: String(e) });
        document.documentElement.dataset.appTheme = 'light';
        document.documentElement.style.colorScheme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
